    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // FIREBASE CONFIGURATION (REPLACE WITH YOURS)
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'rebounce-tracker-v2';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseAppId = appId;
        window.sendSignInLinkToEmail = sendSignInLinkToEmail;
        window.isSignInWithEmailLink = isSignInWithEmailLink;
        window.signInWithEmailLink = signInWithEmailLink;
        window.signOut = signOut;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.onSnapshot = onSnapshot;

        // Handle Passwordless Email Link sign-in completion if clicked from email
        if (isSignInWithEmailLink(auth, window.location.href)) {
            let email = window.localStorage.getItem('emailForSignIn');
            if (!email) {
                email = window.prompt('Please provide your email for confirmation:');
            }
            signInWithEmailLink(auth, email, window.location.href)
                .then((result) => {
                    window.localStorage.removeItem('emailForSignIn');
                    showModal("Success!", "Successfully signed in with passwordless link.");
                    window.history.replaceState({}, document.title, window.location.pathname);
                })
                .catch((error) => {
                    showModal("Sign-In Error", error.message);
                });
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
                loadUserProgress(user.uid);
            } else {
                window.currentUser = null;
                userProgress = {};
                renderLoginScreen();
            }
        });
    </script>

        // --- GENERATORS ---
        function generateMathChemTasks(topicData) {
            let topics = [];
            topicData.forEach(item => {
                let sections = [];
                let dailyTasks = [];
                
                if (item.oneshot) {
                    dailyTasks.push({ id: `${item.id}_l1`, title: item.name, type: "lecture" });
                    dailyTasks.push({ id: `${item.id}_dpp1`, title: "Daily Practice Problem (DPP)", type: "dpp" });
                } else {
                    for(let i=1; i<=item.lec; i++) {
                        dailyTasks.push({ id: `${item.id}_l${i}`, title: `${item.name} L-${i}`, type: "lecture" });
                        dailyTasks.push({ id: `${item.id}_dpp${i}`, title: `DPP for L-${i}`, type: "dpp" });
                    }
                }
                dailyTasks.push({ id: `${item.id}_p1`, title: "Practise Session Level - 1", type: "practice" });
                dailyTasks.push({ id: `${item.id}_p2`, title: "Practise Session Level - 2", type: "practice" });
                
                sections.push({ title: "Daily Lectures & Practice", tasks: dailyTasks });
                sections.push({
                    title: "Chapter Assessments",
                    tasks: [

            return topics;

                    sections.push({ title: `Subtopic: ${sub.name}`, tasks: subTasks });
                });
                
                topics.push({ id: chapter.id, title: chapter.name, sections: sections });
            });
            return topics;

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');

        function loadUserProgress(userId) {
            if (!window.firebaseDb) return;
            const docRef = window.doc(window.firebaseDb, 'artifacts', window.firebaseAppId, 'users', userId, 'progress', 'data');
            window.onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    userProgress = docSnap.data().tasks || {};
                } else {
                    userProgress = {};
                }
                if (currentView === 'dashboard') renderDashboard();
                else if (currentView === 'subject') renderSubject(currentSubjectId);
                else if (currentView === 'topic') renderTopic(currentSubjectId, currentTopicId);
            }, (error) => {
                console.error("Error reading progress:", error);
            });
        }

        function saveUserProgress() {
            if (!window.currentUser || !window.firebaseDb) return;
            const userId = window.currentUser.uid;
            const docRef = window.doc(window.firebaseDb, 'artifacts', window.firebaseAppId, 'users', userId, 'progress', 'data');
            window.setDoc(docRef, { tasks: userProgress }, { merge: true }).catch((err) => {
                console.error("Error saving progress:", err);
            });
        }

        // --- CALCULATIONS ---
        function calculateStats(subjectId) {
            let stats = {
                learn: { total: 0, completed: 0 },
                practice: { total: 0, completed: 0 },
                assess: { total: 0, completed: 0 }
            };

            SYLLABUS[subjectId].topics.forEach(topic => {
                topic.sections.forEach(section => {
                    section.tasks.forEach(task => {
                        let category = 'practice';
                        if (task.type === 'lecture' || task.type === 'video') category = 'learn';
                        if (task.type === 'test' || task.type === 'pyq') category = 'assess';

                        stats[category].total += 1;
                        let status = userProgress[task.id] || 0;
                        if (status === 1) stats[category].completed += 0.5;
                        if (status === 2) stats[category].completed += 1.0;
                    });
                });
            });

            return {
                learnPct: stats.learn.total ? Math.round((stats.learn.completed / stats.learn.total) * 100) : 0,
                pracPct: stats.practice.total ? Math.round((stats.practice.completed / stats.practice.total) * 100) : 0,
                assessPct: stats.assess.total ? Math.round((stats.assess.completed / stats.assess.total) * 100) : 0
            };
        }

        function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            if (!email) {

            const actionCodeSettings = {
                url: window.location.href,
                handleCodeInApp: true,

                    window.localStorage.setItem('emailForSignIn', email);

            let html = `<div class="fade-in space-y-4">
                <p class="text-sm text-gray-500 mb-2">Select a subject to track your daily progress.</p>`;

            Object.keys(SYLLABUS).forEach(subId => {
                const sub = SYLLABUS[subId];
                const stats = calculateStats(subId);
                
                let colorClass = 'bg-teal-500';
                if (sub.color === 'blue') colorClass = 'bg-blue-500';
                if (sub.color === 'orange') colorClass = 'bg-orange-500';

                html += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 cursor-pointer hover:shadow-md transition active:scale-[0.98]" onclick="renderSubject('${subId}')">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-bold text-gray-800">${sub.title}</h2>
                            <div class="w-10 h-10 rounded-full ${colorClass} text-white flex items-center justify-center shadow-inner">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                                </svg>
                            </div>
                        </div>
                        ${renderProgressBar('Lectures / Videos', stats.learnPct, colorClass)}
                        ${renderProgressBar('Practice Modules', stats.pracPct, colorClass)}
                        ${renderProgressBar('Tests & PYQs', stats.assessPct, colorClass)}
                    </div>
                `;
            });

            html += `</div>`;
            mainContent.innerHTML = html;
        }

        function renderSubject(subjectId) {
            currentView = 'subject';
            currentSubjectId = subjectId;
            const sub = SYLLABUS[subjectId];
            updateHeader(sub.title, true);

            let html = `<div class="fade-in space-y-3">
                <div class="bg-slate-100 text-slate-700 text-xs px-4 py-3 rounded-xl mb-4 font-medium flex items-start">
                   <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                   Select a chapter below to view subtopics, videos, and tests.
                </div>
            `;

            sub.topics.forEach(topic => {
                let total = 0; let completed = 0;
                topic.sections.forEach(sec => {
                    sec.tasks.forEach(t => {
                        total++;
                        if(userProgress[t.id] === 1) completed += 0.5;
                        if(userProgress[t.id] === 2) completed += 1;
                    });
                });
                let pct = total ? Math.round((completed/total)*100) : 0;
                
                let borderColor = pct === 100 ? 'border-emerald-400' : 'border-gray-200';
                let iconColor = pct === 100 ? 'text-emerald-500' : 'text-gray-400';

                html += `
                    <div class="bg-white rounded-xl border ${borderColor} p-4 flex items-center justify-between cursor-pointer hover:bg-gray-50 transition active:bg-gray-100 shadow-sm" onclick="renderTopic('${subjectId}', '${topic.id}')">
                        <div class="flex-1 pr-4">
                            <h3 class="text-md font-semibold text-gray-800 mb-1">${topic.title}</h3>
                            <div class="w-full bg-gray-200 rounded-full h-1.5 mt-2">
                                <div class="bg-slate-700 h-1.5 rounded-full" style="width: ${pct}%"></div>
                            </div>
                        </div>
                        <div class="${iconColor}">
                            ${pct === 100 
                                ? `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>`
                                : `<span class="text-xs font-bold">${pct}%</span>`
                            }
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            mainContent.innerHTML = html;
        }

        function renderTopic(subjectId, topicId) {
            currentView = 'topic';
            currentTopicId = topicId;
            const sub = SYLLABUS[subjectId];
            const topic = sub.topics.find(t => t.id === topicId);
            
            updateHeader(topic.title, true);

            let html = `<div class="fade-in">
                <div class="flex justify-end items-center mb-4 px-1">
                    <span class="text-[10px] text-gray-500 italic">Tap twice for full complete</span>
                </div>
            `;

            topic.sections.forEach(section => {
                html += `
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1 mt-6">${section.title}</h3>
                    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden mb-4">
                `;

                section.tasks.forEach((task, index) => {
                    let status = userProgress[task.id] || 0;
                    let svg = status === 2 ? SVG_FULL : (status === 1 ? SVG_PARTIAL : SVG_UNCHECKED);
                    let textClass = status === 2 ? 'text-gray-400 line-through' : 'text-gray-800';
                    let borderClass = index !== section.tasks.length - 1 ? 'border-b border-gray-100' : '';
                    
                    let badgeColor = 'bg-gray-100 text-gray-500';
                    if(task.type === 'lecture') badgeColor = 'bg-blue-50 text-blue-600';
                    if(task.type === 'video') badgeColor = 'bg-red-50 text-red-600';
                    if(task.type === 'practice') badgeColor = 'bg-orange-50 text-orange-600';
                    if(task.type === 'dpp') badgeColor = 'bg-pink-50 text-pink-600';
                    if(task.type === 'test') badgeColor = 'bg-purple-50 text-purple-600';
                    if(task.type === 'pyq') badgeColor = 'bg-emerald-50 text-emerald-600';

                    let badgeText = task.type.toUpperCase();

                    html += `
                        <div class="flex items-center p-4 ${borderClass} active:bg-gray-50 transition" onclick="toggleTask('${task.id}')">
                            <div class="mr-4 relative w-8 h-8 shrink-0 flex items-center justify-center cursor-pointer">
                                ${svg}
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="text-sm font-medium ${textClass}">${task.title}</h4>
                                <span class="inline-block mt-1.5 text-[9px] font-bold tracking-wider px-2 py-0.5 rounded ${badgeColor}">${badgeText}</span>
                            </div>
                            ${status === 1 ? `<span class="text-[10px] text-yellow-600 font-bold bg-yellow-50 px-2 py-1 rounded ml-2 shrink-0">PARTIAL</span>` : ''}
                        </div>
                    `;
                });
                
                html += `</div>`;
            });

            html += `</div>`;
            mainContent.innerHTML = html;
        }

        function renderProfile() {
            currentView = 'profile';
            updateHeader('Student Profile', false);
            bottomNav.classList.remove('hidden');

            const email = window.currentUser ? window.currentUser.email : 'Not signed in';

            mainContent.innerHTML = `
                <div class="fade-in space-y-4">
                    <div class="bg-white rounded-2xl p-5 border border-gray-200 shadow-sm text-center">
                        <div class="w-16 h-16 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center text-xl font-bold mx-auto mb-3">
                            ${email.charAt(0).toUpperCase()}
                        </div>
                        <h3 class="text-md font-bold text-gray-800 mb-1">Logged In User</h3>
                        <p class="text-xs text-gray-500 mb-4">${email}</p>
                        <button onclick="handleLogout()" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-red-100 transition">Sign Out</button>
                    </div>
                </div>
            `;
        }

        function handleLogout() {
            window.signOut(window.firebaseAuth).then(() => {
                renderLoginScreen();
            });
        }

        function toggleTask(taskId) {
            let currentStatus = userProgress[taskId] || 0;
            userProgress[taskId] = (currentStatus + 1) % 3;
            saveUserProgress();
            renderTopic(currentSubjectId, currentTopicId);
        }

        function goBack() {
            if (currentView === 'topic') renderSubject(currentSubjectId);
            else if (currentView === 'subject') renderDashboard();
        }

        function renderProgressBar(label, percentage, colorClass) {
            return `
                <div class="mb-3">
                    <div class="flex justify-between text-xs mb-1 font-medium text-gray-600">
                        <span>${label}</span>
                        <span>${percentage}%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div class="${colorClass} h-2 rounded-full transition-all duration-500 ease-out" style="width: ${percentage}%"></div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
