<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rebounce 2.0 Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; background-color: #e5e7eb; }
        .app-container { height: 100dvh; }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        /* Loader */
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #4f46e5; width: 24px; height: 24px; -webkit-animation: spin 1s linear infinite; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center">

    <div id="app" class="app-container w-full max-w-md bg-gray-50 flex flex-col shadow-2xl relative overflow-hidden sm:h-[850px] sm:rounded-3xl sm:my-8 border sm:border-gray-300">
        
        <!-- INITIAL LOADING SCREEN -->
        <div id="loadingView" class="h-full flex flex-col items-center justify-center bg-white z-50 absolute inset-0">
            <div class="loader mb-4"></div>
            <p class="text-sm text-gray-500 font-medium tracking-wide">Connecting to Cloud...</p>
        </div>

        <div id="loginView" class="h-full flex flex-col justify-center px-8 bg-white z-40 absolute inset-0 hidden">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl shadow-lg flex items-center justify-center text-white text-2xl font-bold">R2</div>
            </div>
            <h2 class="text-2xl font-bold text-center text-slate-800 mb-2">Welcome Student</h2>
            <p class="text-sm text-center text-gray-500 mb-8">Enter your phone number to sign in. Your progress will be saved automatically.</p>
            
            <input type="tel" id="phoneInput" placeholder="Enter mobile number" class="w-full px-4 py-3 border border-gray-300 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-lg" pattern="[0-9]*">
            <button id="signInBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition active:scale-95 shadow-md" onclick="handlePhoneSignIn()">Sign In Securely</button>
            
            <div id="loginErrorBox" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg hidden">
                <p id="loginMessage" class="text-xs text-red-600 font-medium text-center"></p>
            </div>
        </div>

        <header class="bg-indigo-700 text-white px-4 py-4 flex items-center justify-between shadow-md z-10 shrink-0 hidden" id="mainHeader">
            <button id="backBtn" class="text-white p-2 -ml-2 hidden rounded-full hover:bg-indigo-600 transition" onclick="goBack()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h1 id="headerTitle" class="text-xl font-bold tracking-wide flex-1 text-center">Rebounce 2.0</h1>
            <div class="w-8"></div>
        </header>

        <main id="mainContent" class="flex-1 overflow-y-auto bg-gray-50 p-4 pb-24 hidden"></main>

        <!-- Profile Overlay -->
        <div id="profileOverlay" class="absolute inset-0 bg-white z-30 hidden flex flex-col p-6 pt-12">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Profile & Settings</h2>
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4 shadow-sm">
                <p class="text-xs text-gray-500 uppercase tracking-wider font-bold mb-1">Logged in as (Phone)</p>
                <p class="text-xl font-bold text-indigo-700 tracking-wide" id="profilePhoneDisplay">Loading...</p>
            </div>
            <button onclick="handleSignOut()" class="w-full py-3 bg-red-50 text-red-600 font-bold rounded-xl border border-red-200 mt-auto mb-16 active:scale-95 transition">Sign Out</button>
        </div>

        <!-- Custom Toast Notification System -->
        <div id="toast" class="absolute bottom-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-2 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50 text-sm font-medium flex items-center">
            <span id="toastMsg">Saved!</span>
        </div>

        <nav class="bg-white border-t border-gray-200 shrink-0 px-6 py-3 flex justify-between items-center z-20 hidden shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]" id="bottomNav">
            <button class="flex flex-col items-center nav-btn text-indigo-600" id="navHome" onclick="showDashboard()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                <span class="text-[10px] mt-1 font-semibold">Home</span>
            </button>
            <button class="flex flex-col items-center nav-btn text-gray-400" id="navStats" onclick="showStats()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                <span class="text-[10px] mt-1 font-semibold">Stats</span>
            </button>
            <button class="flex flex-col items-center nav-btn text-gray-400" id="navProfile" onclick="showProfile()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                <span class="text-[10px] mt-1 font-semibold">Profile</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ======================================================================
        // FIREBASE CONFIGURATION (LOCKED IN)
        // ======================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBLq_vb2DG8w8rLci4p4Nx7uhE2ZjYvjn8",
            authDomain: "rebounce-tracker.firebaseapp.com",
            projectId: "rebounce-tracker",
            storageBucket: "rebounce-tracker.firebasestorage.app",
            messagingSenderId: "497476611656",
            appId: "1:497476611656:web:6bf41a726689078474b27d"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Firebase Init Error:", e);
        }

        // --- Custom UI Toast Notifications (Replaces alert()) ---
        window.showToast = function(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toastMsg');
            msgSpan.textContent = message;
            toast.className = `absolute bottom-20 left-1/2 transform -translate-x-1/2 px-6 py-2 rounded-full shadow-lg transition-opacity duration-300 pointer-events-none z-50 text-sm font-medium flex items-center ${isError ? 'bg-red-600 text-white' : 'bg-slate-800 text-white'}`;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2500);
        };

        function showLoginError(msg) {
            const box = document.getElementById('loginErrorBox');
            const txt = document.getElementById('loginMessage');
            txt.textContent = msg;
            box.classList.remove('hidden');
        }

        const mathData = [
            { t: "Basic Mathematics", l: 5 }, { t: "Sets and Relations", l: 3 }, { t: "Functions", l: 5 },
            { t: "ITF", l: 4 }, { t: "Limits", l: 3 }, { t: "Continuity and Differentiability", l: 6 },
            { t: "MOD", l: 2 }, { t: "AOD", l: 7 }, { t: "Indefinite Integration", l: 5 },
            { t: "Definite Integration", l: 4 }, { t: "Differential Equation", l: 5 }, { t: "AUC", l: 2 },
            { t: "Vector Algebra", l: 4 }, { t: "3D Geometry", l: 5 }, { t: "P and C", l: 5 },
            { t: "Probability", l: 5 }, { t: "Straight Lines", l: 5 }, { t: "Circles", l: 4 },
            { t: "Parabola", l: 4 }, { t: "Ellipse and Hyperbola", l: 7 }, { t: "Complex Numbers", l: 6 },
            { t: "Statistics One Shot", l: 1, oneshot: true }
        ];

        const chemData = [
            { t: "Mole Concept", l: 4 }, { t: "Dilute Solution", l: 4 }, { t: "Electrochemistry", l: 5 },
            { t: "Chemical Kinetics", l: 4 }, { t: "Periodic Properties", l: 4 }, { t: "Chemical Bonding", l: 10 },
            { t: "Nomenclature", l: 2 }, { t: "Isomerism", l: 3 }, { t: "GOC", l: 5 }, { t: "Hydrocarbons", l: 5 },
            { t: "Haloalkanes Haloarenes", l: 5 }, { t: "Alcohol Phenol Ether", l: 4 }, { t: "Carbonyl Compounds", l: 5 },
            { t: "Amines", l: 3 }, { t: "POC", l: 2 }, { t: "Biomolecules", l: 3 }, { t: "d and f block elements", l: 4 },
            { t: "Coordination Compounds", l: 5 }, { t: "p block elements", l: 6 }, { t: "Qualitative Analysis", l: 2 },
            { t: "Metallurgy", l: 2 }, { t: "Hydrogen", l: 2 }, { t: "s block elements", l: 2 }, { t: "Solid State", l: 4 },
            { t: "Polymer One Shot", l: 1, oneshot: true }, { t: "CIEL One shot", l: 1, oneshot: true },
            { t: "Environmental Chemistry One shot", l: 1, oneshot: true }
        ];

        const physicsData = [
            { title: "Modern Physics", vids: 0, subs: [{ t: "Photoelectric Effect", v: 6 }, { t: "Bohr's Model", v: 9 }, { t: "X-ray", v: 3 }, { t: "Nuclear Physics", v: 8 }] },
            { title: "KTG & Thermodynamics", vids: 0, subs: [{ t: "Kinetic Theory of Gases", v: 3 }, { t: "Thermodynamics", v: 6 }] },
            { title: "Current Electricity", vids: 16, subs: [] },
            { title: "Electrostatics", vids: 0, subs: [{ t: "Electrostatics", v: 33 }, { t: "Conductors", v: 4 }] },
            { title: "Geometrical Optics", vids: 0, subs: [{ t: "Geometrical Optics", v: 70 }, { t: "Optical Instruments", v: 7 }] },
            { title: "Magnetic Effects of Current", vids: 0, subs: [{ t: "Magnetic Effect of Current", v: 7 }, { t: "Electromagnetic Forces", v: 8 }, { t: "Magnetic Properties", v: 4 }] },
            { title: "Rigid Body Dynamics (RBD)", vids: 0, subs: [{ t: "Rotational Motion", v: 18 }] },
            { title: "Wave Optics", vids: 11, subs: [] }
        ];

        function generatePhysics() {
            let topics = [];
            physicsData.forEach((ch, chIdx) => {
                let sections = [];
                let subtopics = ch.subs.length > 0 ? ch.subs : [{ t: ch.title, v: ch.vids }];
                
                subtopics.forEach((sub, subIdx) => {
                    if(sub.v === 0) return; 
                    let tasks = [];
                    for(let i=1; i<=sub.v; i++) {
                        tasks.push({ id: `p_${chIdx}_${subIdx}_v${i}`, title: `Video ${i}`, type: 'video' });
                    }
                    tasks.push({ id: `p_${chIdx}_${subIdx}_res`, title: "Resonance Module", type: 'practice' });
                    tasks.push({ id: `p_${chIdx}_${subIdx}_test`, title: "Chapter-wise Test", type: 'test' });
                    tasks.push({ id: `p_${chIdx}_${subIdx}_pyq`, title: "Chapter-wise PYQs", type: 'pyq' });
                    sections.push({ title: sub.t, tasks: tasks });
                });
                if(sections.length > 0) topics.push({ id: `phy_${chIdx}`, title: ch.title, sections: sections });
            });
            return topics;
        }

        function generateStandard(dataArr, prefix) {
            return dataArr.map((ch, idx) => {
                let tasks = [];
                for(let i=1; i<=ch.l; i++) {
                    let title = ch.oneshot ? ch.t : `${ch.t} L-${i}`;
                    tasks.push({ id: `${prefix}_${idx}_l${i}`, title: title, type: 'lecture' });
                    if (!ch.oneshot) {
                        tasks.push({ id: `${prefix}_${idx}_dpp${i}`, title: `DPP ${i}`, type: 'dpp' });
                    }
                }
                let assess = [
                    { id: `${prefix}_${idx}_p1`, title: "Practise Session Level - 1", type: 'practice' },
                    { id: `${prefix}_${idx}_p2`, title: "Practise Session Level - 2", type: 'practice' },
                    { id: `${prefix}_${idx}_test`, title: "Chapter-wise Test", type: 'test' },
                    { id: `${prefix}_${idx}_pyq`, title: "Chapter-wise PYQs", type: 'pyq' }
                ];
                return {
                    id: `${prefix}_${idx}`, title: ch.t,
                    sections: [{ title: "Daily Lectures & Homework", tasks: tasks }, { title: "Chapter Assessments", tasks: assess }]
                };
            });
        }

        window.SYLLABUS = {
            physics: { title: "Physics", color: "orange", topics: generatePhysics() },
            chemistry: { title: "Chemistry", color: "teal", topics: generateStandard(chemData, 'c') },
            math: { title: "Mathematics", color: "blue", topics: generateStandard(mathData, 'm') }
        };

        window.userProgress = {}; 
        let currentUser = null;
        let currentView = 'dashboard';
        let currentSubjectId = null;
        let currentTopicId = null;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'rebounce-app';

        window.handlePhoneSignIn = async function() {
            if(!auth || !db) { 
                showLoginError("Firebase Keys missing. Please paste your API keys in the code to log in.");
                return; 
            }
            
            const phoneStr = document.getElementById('phoneInput').value.trim();
            if(phoneStr.length < 8) {
                showLoginError('Please enter a valid phone number (minimum 8 digits).');
                return;
            }

            const dummyEmail = `${phoneStr}@rebouncetracker.app`;
            const dummyPassword = `R2Secret_${phoneStr}`;

            const btn = document.getElementById('signInBtn');
            btn.textContent = 'Connecting...';
            btn.disabled = true;
            document.getElementById('loginErrorBox').classList.add('hidden');

            try {
                // Attempt login first
                await signInWithEmailAndPassword(auth, dummyEmail, dummyPassword);
            } catch (error) {
                console.error("Auth Error:", error.code);
                
                if (error.code === 'auth/too-many-requests') {
                    showLoginError("Security block: Too many failed attempts. Please delete this user in Firebase Auth and try again.");
                    btn.textContent = 'Sign In Securely';
                    btn.disabled = false;
                    return;
                }
                
                // If it fails because user doesn't exist, instantly register them
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found') {
                    try {
                        await createUserWithEmailAndPassword(auth, dummyEmail, dummyPassword);
                    } catch (createError) {
                        if (createError.code === 'auth/email-already-in-use') {
                             showLoginError('Account locked/password changed. Please go to Firebase Console -> Authentication and DELETE this number, then try again.');
                        } else {
                            showLoginError('Registration Failed: ' + createError.message);
                        }
                        btn.textContent = 'Sign In Securely';
                        btn.disabled = false;
                    }
                } else if (error.code === 'auth/invalid-api-key') {
                    showLoginError("CRITICAL: Your Firebase API Key is invalid. Check your code.");
                    btn.textContent = 'Sign In Securely';
                    btn.disabled = false;
                } else {
                    showLoginError('Login Failed: ' + error.message);
                    btn.textContent = 'Sign In Securely';
                    btn.disabled = false;
                }
            }
        }

        window.handleSignOut = function() {
            if(auth) signOut(auth);
            window.userProgress = {};
        }

        async function saveProgressToCloud() {
            if(!currentUser || !db) {
                showToast("Cannot save: Database offline.", true);
                return;
            }
            
            showToast("Saving..."); // Show syncing status
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'progress');
                await setDoc(userDocRef, { progress: window.userProgress }, { merge: true });
                showToast("Saved to Cloud!"); 
            } catch(e) { 
                console.error("Save error", e);
                showToast("Error saving to cloud! Check Firestore Rules.", true);
            }
        }

        async function loadProgressFromCloud() {
            if(!currentUser || !db) return;
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'progress');
                const docSnap = await getDoc(userDocRef);
                if (docSnap.exists()) window.userProgress = docSnap.data().progress || {};
            } catch(e) { 
                console.error("Load error", e); 
                showToast("Failed to load past progress.", true);
            }
        }

        if(auth) {
            onAuthStateChanged(auth, async (user) => {
                document.getElementById('loadingView').classList.add('hidden');
                
                if (user) {
                    currentUser = user;
                    let phoneStr = user.email.split('@')[0];
                    document.getElementById('profilePhoneDisplay').textContent = phoneStr;
                    
                    document.getElementById('loginView').classList.add('hidden');
                    document.getElementById('mainHeader').classList.remove('hidden');
                    document.getElementById('mainContent').classList.remove('hidden');
                    document.getElementById('bottomNav').classList.remove('hidden');
                    
                    await loadProgressFromCloud();
                    
                    if(currentView === 'dashboard') renderDashboard();
                    else if (currentView === 'subject') renderSubject(currentSubjectId);
                    else if (currentView === 'topic') renderTopic(currentSubjectId, currentTopicId);
                    else if (currentView === 'stats') renderStats();
                    else if (currentView === 'profile') renderProfile();

                } else {
                    currentUser = null;
                    document.getElementById('loginView').classList.remove('hidden');
                    document.getElementById('mainHeader').classList.add('hidden');
                    document.getElementById('mainContent').classList.add('hidden');
                    document.getElementById('bottomNav').classList.add('hidden');
                    document.getElementById('profileOverlay').classList.add('hidden');
                    
                    const btn = document.getElementById('signInBtn');
                    btn.textContent = 'Sign In Securely';
                    btn.disabled = false;
                }
            });
        } else {
            // Preview / Offline Fallback if keys are not set yet
            setTimeout(() => {
                document.getElementById('loadingView').classList.add('hidden');
                document.getElementById('loginView').classList.remove('hidden');
                showLoginError("Firebase Keys missing. Please add your keys to the code to use the app.");
            }, 500);
        }

        function updateNavState(activeTab) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-indigo-600');
                btn.classList.add('text-gray-400');
            });
            const activeBtn = document.getElementById('nav' + activeTab);
            if(activeBtn) {
                activeBtn.classList.remove('text-gray-400');
                activeBtn.classList.add('text-indigo-600');
            }
        }

        window.showDashboard = function() {
            document.getElementById('profileOverlay').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            updateNavState('Home');
            renderDashboard();
        }

        window.showStats = function() {
            document.getElementById('profileOverlay').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            updateNavState('Stats');
            renderStats();
        }

        window.showProfile = function() {
            currentView = 'profile';
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('profileOverlay').classList.remove('hidden');
            document.getElementById('headerTitle').textContent = 'Profile';
            document.getElementById('backBtn').classList.add('hidden');
            updateNavState('Profile');
        }

        const SVG_UNCHECKED = `<svg class="w-8 h-8 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="2"></circle></svg>`;
        const SVG_PARTIAL = `<svg class="w-8 h-8 text-yellow-500" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 000 20V2z" /></svg><svg class="w-8 h-8 text-yellow-500 absolute top-0 left-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="2"></circle></svg>`;
        const SVG_FULL = `<svg class="w-8 h-8 text-emerald-500" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm-1.83-5.32l-3.48-3.48a1 1 0 011.41-1.41l2.07 2.07 4.79-5.99a1 1 0 111.56 1.25l-5.64 7.05a.998.998 0 01-1.42.06z" clip-rule="evenodd" /></svg>`;

        function calculateStats(subjectId) {
            let stats = {
                learn: { total: 0, completed: 0 },
                prac: { total: 0, completed: 0 },
                assess: { total: 0, completed: 0 }
            };

            window.SYLLABUS[subjectId].topics.forEach(topic => {
                topic.sections.forEach(sec => sec.tasks.forEach(task => {
                    let cat = 'prac';
                    if (task.type === 'lecture' || task.type === 'video') cat = 'learn';
                    if (task.type === 'test' || task.type === 'pyq') cat = 'assess';

                    stats[cat].total += 1;
                    let status = window.userProgress[task.id] || 0;
                    if (status === 1) stats[cat].completed += 0.5;
                    if (status === 2) stats[cat].completed += 1.0;
                }));
            });

            return {
                learnPct: stats.learn.total ? Math.round((stats.learn.completed / stats.learn.total) * 100) : 0,
                pracPct: stats.prac.total ? Math.round((stats.prac.completed / stats.prac.total) * 100) : 0,
                assessPct: stats.assess.total ? Math.round((stats.assess.completed / stats.assess.total) * 100) : 0,
                totalTasks: stats.learn.total + stats.prac.total + stats.assess.total,
                totalCompleted: stats.learn.completed + stats.prac.completed + stats.assess.completed
            };
        }

        window.renderDashboard = function() {
            currentView = 'dashboard';
            document.getElementById('headerTitle').textContent = 'My Schedule';
            document.getElementById('backBtn').classList.add('hidden');
            
            let html = `<div class="fade-in space-y-4"><p class="text-sm text-gray-500 mb-2 font-medium px-1">Select a subject to track progress.</p>`;

            Object.keys(window.SYLLABUS).forEach(subId => {
                const sub = window.SYLLABUS[subId];
                const stats = calculateStats(subId);
                let colorClass = sub.color === 'blue' ? 'bg-blue-500' : (sub.color === 'orange' ? 'bg-orange-500' : 'bg-teal-500');

                html += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 cursor-pointer hover:shadow-md transition active:scale-[0.98]" onclick="renderSubject('${subId}')">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-bold text-gray-800">${sub.title}</h2>
                            <div class="w-10 h-10 rounded-full ${colorClass} text-white flex items-center justify-center shadow-inner">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
                            </div>
                        </div>
                        <div class="mb-3"><div class="flex justify-between text-xs mb-1 font-medium text-gray-600"><span>Lectures / Videos</span><span>${stats.learnPct}%</span></div><div class="w-full bg-gray-200 rounded-full h-2"><div class="${colorClass} h-2 rounded-full transition-all duration-500" style="width: ${stats.learnPct}%"></div></div></div>
                        <div class="mb-3"><div class="flex justify-between text-xs mb-1 font-medium text-gray-600"><span>Practice & DPPs</span><span>${stats.pracPct}%</span></div><div class="w-full bg-gray-200 rounded-full h-2"><div class="${colorClass} h-2 rounded-full transition-all duration-500" style="width: ${stats.pracPct}%"></div></div></div>
                        <div class="mb-3"><div class="flex justify-between text-xs mb-1 font-medium text-gray-600"><span>Tests & PYQs</span><span>${stats.assessPct}%</span></div><div class="w-full bg-gray-200 rounded-full h-2"><div class="${colorClass} h-2 rounded-full transition-all duration-500" style="width: ${stats.assessPct}%"></div></div></div>
                    </div>`;
            });
            document.getElementById('mainContent').innerHTML = html + `</div>`;
        }

        window.renderStats = function() {
            currentView = 'stats';
            document.getElementById('headerTitle').textContent = 'Overall Analytics';
            document.getElementById('backBtn').classList.add('hidden');

            let totalTasks = 0;
            let totalCompleted = 0;

            let html = `<div class="fade-in space-y-4">`;

            Object.keys(window.SYLLABUS).forEach(subId => {
                const sub = window.SYLLABUS[subId];
                const stats = calculateStats(subId);
                totalTasks += stats.totalTasks;
                totalCompleted += stats.totalCompleted;
                
                let subPct = stats.totalTasks ? Math.round((stats.totalCompleted/stats.totalTasks)*100) : 0;
                let colorClass = sub.color === 'blue' ? 'text-blue-500' : (sub.color === 'orange' ? 'text-orange-500' : 'text-teal-500');

                html += `
                    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
                        <div>
                            <h3 class="font-bold text-gray-800">${sub.title} Mastery</h3>
                            <p class="text-xs text-gray-500 mt-1">${stats.totalCompleted} / ${stats.totalTasks} Tasks</p>
                        </div>
                        <div class="text-2xl font-black ${colorClass}">${subPct}%</div>
                    </div>
                `;
            });

            let masterPct = totalTasks ? Math.round((totalCompleted/totalTasks)*100) : 0;

            let headerHtml = `
                <div class="bg-indigo-700 text-white rounded-2xl p-6 mb-6 shadow-md text-center">
                    <p class="text-indigo-200 text-xs uppercase tracking-widest font-bold mb-2">Total JEE Completion</p>
                    <div class="text-5xl font-black mb-2">${masterPct}%</div>
                    <p class="text-sm font-medium opacity-90">${totalCompleted} completed out of ${totalTasks} total tasks</p>
                </div>
            `;

            document.getElementById('mainContent').innerHTML = headerHtml + html + `</div>`;
        }

        window.renderSubject = function(subjectId) {
            currentView = 'subject';
            currentSubjectId = subjectId;
            const sub = window.SYLLABUS[subjectId];
            document.getElementById('headerTitle').textContent = sub.title;
            document.getElementById('backBtn').classList.remove('hidden');

            let html = `<div class="fade-in space-y-3"><div class="bg-slate-100 text-slate-700 text-xs px-4 py-3 rounded-xl mb-4 font-medium flex items-start"><svg class="h-4 w-4 mr-2 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>Select a chapter below to mark your progress.</div>`;

            sub.topics.forEach(topic => {
                let total = 0, completed = 0;
                topic.sections.forEach(sec => sec.tasks.forEach(t => {
                    total++;
                    if(window.userProgress[t.id] === 1) completed += 0.5;
                    if(window.userProgress[t.id] === 2) completed += 1;
                }));
                let pct = total ? Math.round((completed/total)*100) : 0;
                let bColor = pct === 100 ? 'border-emerald-400' : 'border-gray-200';
                let iColor = pct === 100 ? 'text-emerald-500' : 'text-gray-400';

                html += `
                    <div class="bg-white rounded-xl border ${bColor} p-4 flex items-center justify-between cursor-pointer hover:bg-gray-50 active:bg-gray-100 shadow-sm" onclick="renderTopic('${subjectId}', '${topic.id}')">
                        <div class="flex-1 pr-4">
                            <h3 class="text-md font-semibold text-gray-800 mb-1">${topic.title}</h3>
                            <div class="w-full bg-gray-200 rounded-full h-1.5 mt-2"><div class="bg-slate-700 h-1.5 rounded-full" style="width: ${pct}%"></div></div>
                        </div>
                        <div class="${iColor}">
                            ${pct === 100 ? `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>` : `<span class="text-xs font-bold">${pct}%</span>`}
                        </div>
                    </div>`;
            });
            document.getElementById('mainContent').innerHTML = html + `</div>`;
        }

        window.renderTopic = function(subjectId, topicId) {
            currentView = 'topic';
            currentTopicId = topicId;
            const sub = window.SYLLABUS[subjectId];
            const topic = sub.topics.find(t => t.id === topicId);
            document.getElementById('headerTitle').textContent = topic.title;

            let html = `<div class="fade-in"><div class="flex justify-end items-center mb-4 px-1"><span class="text-[10px] text-gray-500 italic font-medium">Tap twice to fully complete</span></div>`;

            topic.sections.forEach(section => {
                html += `<h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1 mt-6">${section.title}</h3><div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden mb-4">`;

                section.tasks.forEach((task, index) => {
                    let status = window.userProgress[task.id] || 0;
                    let svg = status === 2 ? SVG_FULL : (status === 1 ? SVG_PARTIAL : SVG_UNCHECKED);
                    let tClass = status === 2 ? 'text-gray-400 line-through' : 'text-gray-800';
                    let bClass = index !== section.tasks.length - 1 ? 'border-b border-gray-100' : '';
                    
                    let bg = 'bg-gray-100 text-gray-500';
                    if(task.type === 'lecture') bg = 'bg-blue-50 text-blue-600';
                    if(task.type === 'video') bg = 'bg-red-50 text-red-600';
                    if(task.type === 'dpp') bg = 'bg-pink-50 text-pink-600';
                    if(task.type === 'practice') bg = 'bg-orange-50 text-orange-600';
                    if(task.type === 'test') bg = 'bg-purple-50 text-purple-600';
                    if(task.type === 'pyq') bg = 'bg-emerald-50 text-emerald-600';

                    html += `
                        <div class="flex items-center p-4 ${bClass} active:bg-gray-50 transition" onclick="toggleTask('${task.id}')">
                            <div class="mr-4 relative w-8 h-8 shrink-0 flex items-center justify-center cursor-pointer">${svg}</div>
                            <div class="flex-1 min-w-0">
                                <h4 class="text-sm font-medium ${tClass}">${task.title}</h4>
                                <span class="inline-block mt-1.5 text-[9px] font-bold tracking-wider px-2 py-0.5 rounded ${bg}">${task.type.toUpperCase()}</span>
                            </div>
                            ${status === 1 ? `<span class="text-[10px] text-yellow-600 font-bold bg-yellow-50 px-2 py-1 rounded ml-2 shrink-0 border border-yellow-200">PARTIAL</span>` : ''}
                        </div>`;
                });
                html += `</div>`;
            });
            document.getElementById('mainContent').innerHTML = html + `</div>`;
        }

        window.toggleTask = function(taskId) {
            let s = window.userProgress[taskId] || 0;
            window.userProgress[taskId] = (s + 1) % 3;
            renderTopic(currentSubjectId, currentTopicId);
            saveProgressToCloud(); 
        }

        window.goBack = function() {
            if (currentView === 'topic') renderSubject(currentSubjectId);
            else if (currentView === 'subject') showDashboard();
        }

    </script>
</body>
</html>
